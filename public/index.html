<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JoreCamilo</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      color: #fff;
      font-family: Arial, sans-serif;
    }

    /* Página de entrada */
    .entrada {
      position: relative;
      width: 100%;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
      background: #000;
    }

    /* Cojito */
    .cojito {
      width: min(70vw, 960px);
      height: auto;
      display: block;
    }

    /* ENTRAR funciona como una capa independiente */
    .entrar {
      position: absolute;
      left: 50%;
      bottom: 7vh;

      transform: translateX(-50%);

      color: #fff;
      text-decoration: none;

      font-size: 18px;
      letter-spacing: 0.25em;

      cursor: pointer;
    }

  </style>
</head>


<body>

  <main class="entrada">

    <!-- Cojito / TouchDesigner -->
    <video
      class="cojito"
      autoplay
      muted
      loop
      playsinline
      preload="auto">

      <source
        src="./cojito_web_60fps.webm"
        type="video/webm">

    </video>


    <!-- Entrada al universo -->
    <a
      class="entrar"
      href="#universo">
      ENTRAR
    </a>

  </main>

</body>

</html>
