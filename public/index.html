<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoreCamilo</title>

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .entrada {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .cojito {
      width: min(70vw, 960px);
      height: auto;
      display: block;
      margin-bottom: 20px;
    }

    .entrar {
      color: #fff;
      text-decoration: none;
      font-size: 18px;
      letter-spacing: 0.25em;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <main class="entrada">

    <video
      class="cojito"
      autoplay
      muted
      loop
      playsinline
      preload="auto">
      <source src="./cojito_web_60fps.webm" type="video/webm">
    </video>

    <a class="entrar" href="#universo">
      ENTRAR
    </a>

  </main>

</body>
</html>
