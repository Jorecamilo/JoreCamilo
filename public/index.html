<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JoreCamilo</title>

  <style>
    :root {
  --blanco-jore: #e0d7c1;
  --negro-jore: #000000;
}

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow-x: hidden;
    }

    body {
      color: #fff;
      font-family: Arial, sans-serif;
    }

    /* Escenario completo */
    .entrada {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #000;
    }

    /*
      Página / portal vertical.
      Mantiene la proporción 2:3 del marco
      sin deformarlo.
    */
    .portal {
      position: relative;

      height: 92vh;
      height: 92dvh;

      aspect-ratio: 2 / 3;

      max-width: 94vw;
    }

    /* Cojito vive dentro del portal */
    .cojito {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      width: 125%;
      height: auto;

      z-index: 1;
    }

    /* Marco de La lámpara maravillosa */
    .marco {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;
      display: none;
      object-fit: contain;

      pointer-events: none;

      z-index: 2;
    }

    /* Entrada independiente */
   .entrar {
  position: absolute;

  left: 50%;
  top: 74%;

  transform: translateX(-50%);

  color: var(--blanco-jore);
  text-decoration: none;

  font-size: 15px;
  letter-spacing: 0.30em;

  white-space: nowrap;
  cursor: pointer;

  z-index: 3;
}

    /* Ajuste para pantallas estrechas / móviles */
    @media (max-aspect-ratio: 2/3) {

      .portal {
        width: 94vw;
        height: auto;
        aspect-ratio: 2 / 3;
      }

      .cojito {
        width: 96%;
      }

    }

  </style>
</head>


<body>

  <main class="entrada">

    <section class="portal">

      <!-- Cojito / TouchDesigner -->
      <video
        class="cojito"
        autoplay
        muted
        loop
        playsinline
        preload="auto">

        <source
          src="./cojito_web_60fps.webm"
          type="video/webm">

      </video>


      <!-- Marco editorial -->
      <img
        class="marco"
      src="./marco_lampara_WEB.png"
        alt="">


      <!-- Entrada al universo -->
      <a
        class="entrar"
        href="#indice">
        ENTRAR
      </a>

    </section>

  </main>

<section id="indice" class="indice">

  <div class="indice-contenido">
    JORECAMILO
  </div>

</section>
</body>

</html>
