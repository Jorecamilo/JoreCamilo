<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo | JoreCamilo</title>
  <style>
    :root {
      --blanco-jore: #e0d7c1;
      --negro-jore: #000000;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--negro-jore);
      color: var(--blanco-jore);
    }

    body {
      font-family: Arial, sans-serif;
    }

    .universo {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 48px 7vw;
    }

    .indice {
      position: relative;
      width: min(34vw, 420px, 50vh);
      width: min(34vw, 420px, 50dvh);
      flex: none;
    }

    .indice-marco {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .indice-contenido {
      position: absolute;
      inset: 48% 12% auto;
      transform: translateY(-50%);
      text-align: center;
    }

    .indice h1 {
      margin: 0 0 clamp(40px, 6vh, 64px);
      font-size: 18px;
      font-weight: normal;
      letter-spacing: 0.22em;
    }

    .indice ul {
      display: grid;
      gap: 28px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: 0.30em;
    }

    @media (max-width: 760px), (max-height: 600px) {
      .universo {
        padding: 32px 24px;
      }

      .indice {
        width: min(100%, 360px);
      }
    }
    /* Experimental entry: keep the approved index's existing layout unchanged. */
    .indice ul { position: relative; }
    .indice .pieza-entrada {
      position: absolute;
      top: calc(100% + 28px);
      width: 100%;
    }
    .piezas-rama { display: inline-block; max-width: 100%; text-align: left; }
    #pieza-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
    }
    #pieza-trigger:focus-visible { outline: 1px dotted currentColor; outline-offset: 5px; }
    .piezas-triangulo { width: 10px; flex: none; letter-spacing: 0; }
    .piezas-despliegue {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows 250ms ease, opacity 250ms ease, visibility 250ms;
    }
    .piezas-rama.abierta .piezas-despliegue {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
    }
    .piezas-despliegue-interior { min-height: 0; overflow: hidden; }
    .indice .piezas-hijos {
      display: block;
      margin: 12px 0 0;
      padding: 0 0 0 18px;
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.16em;
    }
    .pieza-campo {
      position: fixed;
      top: 0;
      right: 0;
      height: 100dvh;
      overflow: hidden;
      background: #000000;
      visibility: hidden;
      pointer-events: none;
    }
    .pieza-campo canvas { display: block; pointer-events: none; }
    .pieza-campo[data-ready="true"] { visibility: visible; }
    @media (hover: none) { .pieza-campo { display: none; } }
  </style>
  <script type="importmap">
    {"imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
    }}
  </script>
</head>
<body>
  <main class="universo">
    <section class="indice" aria-labelledby="indice-titulo">
      <img class="indice-marco" src="./marco_lampara_WEB.png" alt="">
      <div class="indice-contenido">
        <h1 id="indice-titulo">JORECAMILO</h1>
        <ul aria-label="Índice editorial">
          <li>ÁLBUM</li>
          <li>OBRA</li>
          <li>EL CARACOL</li>
          <li class="pieza-entrada">
            <div class="piezas-rama">
              <button id="pieza-trigger" type="button" aria-expanded="false" aria-controls="piezas-listado"><span class="piezas-triangulo" aria-hidden="true">▸</span><span>PIEZAS</span></button>
              <div class="piezas-despliegue" id="piezas-listado" aria-hidden="true" inert>
                <div class="piezas-despliegue-interior">
                  <ul class="piezas-hijos"><li>OXÍMORON</li></ul>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </section>
  </main>
  <div class="pieza-campo" id="pieza-campo" aria-hidden="true"></div>
  <script type="module" src="./universo-pieza.js"></script>
</body>
</html>
