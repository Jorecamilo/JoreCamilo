<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo | JoreCamilo</title>
  <style>
    :root {
      --blanco-jore: #e0d7c1;
      --negro-jore: #000000;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--negro-jore);
      color: var(--blanco-jore);
    }

    body {
      font-family: Arial, sans-serif;
    }

    .universo {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 48px 7vw;
    }

    .indice {
      position: relative;
      width: min(34vw, 420px, 50vh);
      width: min(34vw, 420px, 50dvh);
      flex: none;
    }

    .indice-marco {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .indice-contenido {
      position: absolute;
      inset: 26% 12% 12%;
      box-sizing: border-box;
      padding-top: 60px;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--blanco-jore) transparent;
      text-align: center;
    }

    .indice h1 {
      position: absolute;
      top: 20%;
      left: 10%;
      right: 10%;
      margin: 0;
      font-size: 18px;
      line-height: 1.2;
      font-weight: normal;
      letter-spacing: 0.28em;
      text-align: center;
      text-indent: 0.28em;
    }

    .indice ul {
      display: grid;
      gap: 28px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: 0.30em;
    }

    @media (max-width: 760px) {
      .universo {
        padding: 32px 24px;
      }

      .indice {
        width: min(100%, 360px);
      }
    }
    .piezas-rama { display: block; width: max-content; max-width: 100%; margin-inline: auto; text-align: left; }
    .categoria-trigger, #oximoron-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
    }
    .categoria-trigger:focus-visible, #oximoron-trigger:focus-visible { outline: 1px dotted currentColor; outline-offset: 5px; }
    .piezas-triangulo { width: 10px; flex: none; letter-spacing: 0; }
    .piezas-despliegue {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows 250ms ease, opacity 250ms ease, visibility 250ms;
    }
    .piezas-rama.abierta .piezas-despliegue {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
    }
    .piezas-despliegue-interior { min-height: 0; overflow: hidden; }
    .indice .piezas-hijos {
      display: block;
      margin: 12px 0 0;
      padding: 0 0 0 18px;
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.08em;
    }
    .pieza-campo {
      position: fixed;
      top: 0;
      right: 0;
      height: 100dvh;
      overflow: hidden;
      background: #000000;
      visibility: hidden;
      pointer-events: none;
    }
    .pieza-campo canvas { display: block; pointer-events: none; }
    .pieza-campo[data-ready="true"] { visibility: visible; }
    @media (max-width: 760px) {
      .universo { min-height: 0; display: block; padding: 16px 24px 0; }
      .indice { width: min(100%, 320px); margin: 0 auto; }
      .indice-contenido { inset: 22px 22px 18px; padding-top: 36.4px; }
      .indice h1 { top: 18px; }
      .indice > .indice-contenido > ul { gap: 2px; }
      .indice-marco { aspect-ratio: 1; }
      .categoria-trigger, #oximoron-trigger { min-height: 36px; }
      .indice .piezas-hijos { margin-top: 4px; }
      .pieza-campo { position: relative; inset: auto; width: 100%; height: clamp(260px, 44svh, 380px); margin-top: 4px; }
    }
    @media (pointer: coarse) {
      .categoria-trigger, #oximoron-trigger { min-height: 36px; }
      .indice .piezas-hijos { margin-top: 4px; }
    }
  </style>
  <script type="importmap">
    {"imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
    }}
  </script>
</head>
<body>
  <main class="universo">
    <section class="indice" aria-labelledby="indice-titulo">
      <picture>
        <source media="(max-width: 760px)" srcset="./marco_universo_movil.svg" width="600" height="600">
        <img class="indice-marco" src="./marco_universo.svg" width="600" height="900" alt="">
      </picture>
      <h1 id="indice-titulo" data-section="autobiografia">JORECAMILO</h1>
      <div class="indice-contenido">
        <ul aria-label="Índice editorial">
          <li>
            <div class="piezas-rama">
              <button class="categoria-trigger" id="album-trigger" type="button" aria-expanded="false" aria-controls="album-listado"><span class="piezas-triangulo" aria-hidden="true">▸</span><span>ÁLBUM</span></button>
              <div class="piezas-despliegue" id="album-listado" aria-hidden="true" inert><div class="piezas-despliegue-interior"></div></div>
            </div>
          </li>
          <li>
            <div class="piezas-rama">
              <button class="categoria-trigger" id="obra-trigger" type="button" aria-expanded="false" aria-controls="obra-listado"><span class="piezas-triangulo" aria-hidden="true">▸</span><span>OBRA</span></button>
              <div class="piezas-despliegue" id="obra-listado" aria-hidden="true" inert><div class="piezas-despliegue-interior"></div></div>
            </div>
          </li>
          <li>
            <div class="piezas-rama">
              <button class="categoria-trigger" id="caracol-trigger" type="button" aria-expanded="false" aria-controls="caracol-listado"><span class="piezas-triangulo" aria-hidden="true">▸</span><span>EL CARACOL</span></button>
              <div class="piezas-despliegue" id="caracol-listado" aria-hidden="true" inert><div class="piezas-despliegue-interior"></div></div>
            </div>
          </li>
          <li>
            <div class="piezas-rama">
              <button class="categoria-trigger" id="pieza-trigger" type="button" aria-expanded="false" aria-controls="piezas-listado"><span class="piezas-triangulo" aria-hidden="true">▸</span><span>PIEZAS</span></button>
              <div class="piezas-despliegue" id="piezas-listado" aria-hidden="true" inert>
                <div class="piezas-despliegue-interior">
                  <ul class="piezas-hijos"><li><button id="oximoron-trigger" type="button" aria-pressed="false">Oxímoron</button></li></ul>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </section>
  </main>
  <div class="pieza-campo" id="pieza-campo" aria-hidden="true"></div>
  <script type="module" src="./universo-pieza.js"></script>
</body>
</html>
