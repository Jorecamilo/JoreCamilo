<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Universo | JoreCamilo</title>
  <style>
    :root {
      --blanco-jore: #e0d7c1;
      --negro-jore: #000000;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--negro-jore);
      color: var(--blanco-jore);
    }

    body {
      font-family: Arial, sans-serif;
    }

    .universo {
      box-sizing: border-box;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 48px 7vw;
    }

    .indice {
      position: relative;
      width: min(34vw, 420px, 50vh);
      width: min(34vw, 420px, 50dvh);
      flex: none;
    }

    .indice-marco {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    .indice-contenido {
      position: absolute;
      inset: 48% 12% auto;
      transform: translateY(-50%);
      text-align: center;
    }

    .indice h1 {
      margin: 0 0 clamp(40px, 6vh, 64px);
      font-size: 18px;
      font-weight: normal;
      letter-spacing: 0.22em;
    }

    .indice ul {
      display: grid;
      gap: 28px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 15px;
      line-height: 1.5;
      letter-spacing: 0.30em;
    }

    @media (max-width: 760px), (max-height: 600px) {
      .universo {
        padding: 32px 24px;
      }

      .indice {
        width: min(100%, 360px);
      }
    }
    /* Experimental entry: keep the approved index's existing layout unchanged. */
    .indice ul { position: relative; }
    .indice .pieza-entrada {
      position: absolute;
      top: calc(100% + 28px);
      width: 100%;
    }
    .piezas-rama { display: inline-block; max-width: 100%; text-align: left; }
    #pieza-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      font: inherit;
      letter-spacing: inherit;
      cursor: pointer;
    }
    #pieza-trigger:focus-visible { outline: 1px dotted currentColor; outline-offset: 5px; }
    .piezas-triangulo { width: 10px; flex: none; letter-spacing: 0; }
    .piezas-despliegue {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      visibility: hidden;
      transition: grid-template-rows 250ms ease, opacity 250ms ease, visibility 250ms;
    }
    .piezas-rama.abierta .piezas-despliegue {
      grid-template-rows: 1fr;
      opacity: 1;
      visibility: visible;
    }
    .piezas-despliegue-interior { min-height: 0; overflow: hidden; }
    .indice .piezas-hijos {
      display: block;
      margin: 12px 0 0;
      padding: 0 0 0 18px;
      font-size: 13px;
      line-height: 1.5;
      letter-spacing: 0.16em;
    }
    .pieza-campo {
      position: fixed;
      top: 0;
      right: 0;
      height: 100dvh;
      overflow: hidden;
      background: #000000;
      opacity: 0;
      transition: opacity 600ms ease;
      pointer-events: none;
    }
    .pieza-campo canvas { display: block; pointer-events: none; }
    .pieza-campo[data-ready="true"].activa { opacity: 1; }
    @media (hover: none) { .pieza-campo { display: none; } }
  </style>
  <script type="importmap">
    {"imports":{
      "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
    }}
  </script>
</head>
<body>
  <main class="universo">
    <section class="indice" aria-labelledby="indice-titulo">
      <img class="indice-marco" src="./marco_lampara_WEB.png" alt="">
      <div class="indice-contenido">
        <h1 id="indice-titulo">JORECAMILO</h1>
        <ul aria-label="Índice editorial">
          <li>ÁLBUM</li>
          <li>OBRA</li>
          <li>EL CARACOL</li>
          <li class="pieza-entrada">
            <div class="piezas-rama">
              <button id="pieza-trigger" type="button" aria-expanded="false" aria-controls="piezas-listado"><span class="piezas-triangulo" aria-hidden="true">▸</span><span>PIEZAS</span></button>
              <div class="piezas-despliegue" id="piezas-listado" aria-hidden="true" inert>
                <div class="piezas-despliegue-interior">
                  <ul class="piezas-hijos"><li>OXÍMORON</li></ul>
                </div>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </section>
  </main>
  <div class="pieza-campo" id="pieza-campo" aria-hidden="true"></div>
  <script type="module">
    // Spark 2.3.1 + Three.js 0.180.0, as in pieza-test.html. No 3D controls.
    const field = document.getElementById('pieza-campo');
    const trigger = document.getElementById('pieza-trigger');
    const branch = document.querySelector('.piezas-rama');
    const children = document.getElementById('piezas-listado');
    // Expansion is independent of the existing hover-driven sculpture.
    trigger.addEventListener('click', () => {
      const expanded = trigger.getAttribute('aria-expanded') !== 'true';
      trigger.setAttribute('aria-expanded', String(expanded));
      trigger.querySelector('.piezas-triangulo').textContent = expanded ? '▾' : '▸';
      branch.classList.toggle('abierta', expanded);
      children.setAttribute('aria-hidden', String(!expanded));
      children.inert = !expanded;
    });
    const index = document.querySelector('.indice');
    const hoverDevice = matchMedia('(hover: hover)');
    const source = './PIEZAS/Cara%20arcilla%201%20Ailin.spz';
    let active = false;
    let drawFor = () => {};
    let resizeRenderer = () => {};
    function sizeField() {
      const left = Math.min(innerWidth, Math.max(0, index.getBoundingClientRect().right));
      field.style.left = `${left}px`;
      resizeRenderer();
    }
    trigger.addEventListener('mouseenter', () => {
      if (!hoverDevice.matches) return;
      active = true;
      field.classList.add('activa');
      drawFor(700);
    });
    trigger.addEventListener('mouseleave', () => {
      active = false;
      field.classList.remove('activa');
      drawFor(700);
    });
    addEventListener('blur', () => {
      active = false;
      field.classList.remove('activa');
    });
    addEventListener('resize', sizeField);
    new ResizeObserver(sizeField).observe(index);
    sizeField();

    async function preparePiece() {
      if (!hoverDevice.matches) return;
      const started = performance.now();
      try {
        // Fetch directly from this origin, bypassing an older cached scan.
        // No conversion, upload, persistent copy, or change to the SPZ.
        const [THREE, { SparkRenderer, SplatMesh }, response] = await Promise.all([
          import('three'), import('@sparkjsdev/spark'), fetch(source, { cache: 'no-store' })
        ]);
        if (!response.ok) throw new Error(`SPZ HTTP ${response.status}`);
        const bytes = await response.arrayBuffer();
        const digest = await crypto.subtle.digest('SHA-256', bytes);
        const sha256 = Array.from(new Uint8Array(digest), n => n.toString(16).padStart(2, '0')).join('');
        const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: false });
        renderer.setClearColor(0x000000, 1);
        renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        field.appendChild(renderer.domElement);
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);
        const camera = new THREE.PerspectiveCamera(42, 1, 0.001, 100);
        scene.add(new SparkRenderer({ renderer }));
        const piece = new SplatMesh({ fileBytes: bytes, fileName: 'Cara arcilla 1 Ailin.spz', lod: false });
        await piece.initialized;
        const box = piece.getBoundingBox(true);
        const radius = box.getSize(new THREE.Vector3()).length() / 2;
        if (box.isEmpty() || !Number.isFinite(radius) || radius <= 0) throw new Error('SPZ sin dimensiones válidas');
        piece.position.copy(box.getCenter(new THREE.Vector3()).negate());
        scene.add(piece);
        let until = 0;
        let running = false;
        let warm = false;
        // Render only short settling intervals: preload, hover transitions, resize.
        // The static canvas retains the rendered sculpture without an idle GPU loop.
        drawFor = (milliseconds) => {
          until = performance.now() + milliseconds;
          if (running || document.hidden) return;
          running = true;
          renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
            if (performance.now() >= until || document.hidden) {
              renderer.setAnimationLoop(null);
              running = false;
              if (!warm) {
                warm = true;
                field.dataset.ready = 'true';
                console.info('UNIVERSO_PIEZA_READY', JSON.stringify({ source, bytes: bytes.byteLength, sha256, splats: piece.numSplats, prepareMs: Math.round(performance.now() - started) }));
              }
            }
          });
        };
        resizeRenderer = () => {
          const width = Math.max(1, field.clientWidth);
          const height = Math.max(1, field.clientHeight);
          renderer.setSize(width, height);
          camera.aspect = width / height;
          const halfAngle = Math.min(THREE.MathUtils.degToRad(21), Math.atan(Math.tan(THREE.MathUtils.degToRad(21)) * camera.aspect));
          camera.position.set(0.12, 0.04, 1).normalize().multiplyScalar(radius / Math.sin(halfAngle) * 1.25);
          camera.near = radius / 100;
          camera.far = radius * 100;
          camera.lookAt(0, 0, 0);
          camera.updateProjectionMatrix();
          drawFor(600);
        };
        sizeField();
        document.addEventListener('visibilitychange', () => { if (!document.hidden && active) drawFor(600); });
      } catch (error) {
        console.error('UNIVERSO_PIEZA_ERROR', error);
      }
    }
    // Do not delay the editorial page; prepare invisibly after its initial load.
    function schedulePreparation() {
      if ('requestIdleCallback' in window) requestIdleCallback(preparePiece, { timeout: 1000 });
      else setTimeout(preparePiece, 0);
    }
    if (document.readyState === 'complete') schedulePreparation();
    else addEventListener('load', schedulePreparation, { once: true });
  </script>
</body>
</html>
